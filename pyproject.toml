[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audiomt"
version = "0.1.0"
description = "LLM-assisted metamorphic testing of audio classification models"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "librosa>=0.10.2",
    "soundfile",
    "pydantic>=2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs model downloads or the dataset; skipped in CI"]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
line-length = 110
